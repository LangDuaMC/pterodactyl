#
# ── Zero-mount compose ──────────────────────────────────────────────────
# The panel container needs NO persistent volumes other than the DB image.
#   * Provide APP_KEY and HASHIDS_SALT as env vars (generate once, keep safe).
#   * If omitted, they are auto-generated but will reset on each restart
#     (breaking sessions, encryption, and hashid URLs).
#   * Logs go to stdout via supervisord — capture them with your
#     container orchestrator (systemd-journald, Docker logs, etc.).
# ──────────────────────────────────────────────────────────────────────────
services:
  database:
    image: mariadb:11
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - "db_data:/var/lib/mysql"
    environment:
      MYSQL_ROOT_PASSWORD: "CHANGE_ME"
      MYSQL_PASSWORD: "CHANGE_ME"
      MYSQL_DATABASE: "panel"
      MYSQL_USER: "pterodactyl"

  cache:
    image: redis:alpine
    restart: always

  panel:
    build: .
    restart: always
    ports:
      - "80:80"
    depends_on:
      - database
      - cache
    environment:
      # ── Required ─────────────────────────────────────────────────
      APP_URL: "http://example.com"
      APP_TIMEZONE: "UTC"
      APP_SERVICE_AUTHOR: "noreply@example.com"

      # ── Generate once and keep safe (see below) ──────────────────
      # APP_KEY:
      # HASHIDS_SALT:

      # ── Database ─────────────────────────────────────────────────
      DB_HOST: "database"
      DB_PORT: "3306"
      DB_PASSWORD: "CHANGE_ME"

      # ── Redis ────────────────────────────────────────────────────
      REDIS_HOST: "cache"
      CACHE_STORE: "redis"
      QUEUE_CONNECTION: "redis"
      SESSION_DRIVER: "redis"

      # ── Mail (optional, omit or set your own) ────────────────────
      MAIL_FROM: "noreply@example.com"
      MAIL_DRIVER: "smtp"
      MAIL_HOST: "mail"
      MAIL_PORT: "1025"
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_ENCRYPTION: "true"

volumes:
  db_data:

#
# ── On first deployment ────────────────────────────────────────────────
#   1. docker compose up -d
#   2. docker compose exec panel php artisan p:user:make
#
# ── Generating APP_KEY & HASHIDS_SALT ──────────────────────────────────
#   APP_KEY=$(head -c 48 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 32)
#   HASHIDS_SALT=$(head -c 48 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 20)
#   echo "APP_KEY=$APP_KEY"
#   echo "HASHIDS_SALT=$HASHIDS_SALT"
#

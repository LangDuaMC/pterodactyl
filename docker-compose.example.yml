#
# ── Zero-mount compose ────────────────────────────────────────────────
# The panel container needs NO persistent volumes other than the DB image.
#   * Provide APP_KEY and HASHIDS_SALT as env vars (generate once, keep safe).
#   * If omitted, they are auto-generated but will reset on each restart
#     (breaking sessions, encryption, and hashid URLs).
#   * Logs go to stdout via supervisord.
# ──────────────────────────────────────────────────────────────────────
services:
  database:
    image: mariadb:11
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - "db_data:/var/lib/mysql"
    environment:
      MYSQL_ROOT_PASSWORD: "CHANGE_ME"
      MYSQL_PASSWORD: "CHANGE_ME"
      MYSQL_DATABASE: "panel"
      MYSQL_USER: "pterodactyl"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent --skip-ssl"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  cache:
    image: redis:alpine
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  panel:
    build: .
    restart: always
    ports:
      - "80:80"
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      APP_URL: "http://example.com"
      APP_TIMEZONE: "UTC"
      APP_SERVICE_AUTHOR: "noreply@example.com"

      # Generate once and keep safe (see below)
      # APP_KEY:
      # HASHIDS_SALT:

      # Database
      DB_HOST: "database"
      DB_PORT: "3306"
      DB_PASSWORD: "CHANGE_ME"

      # Redis
      REDIS_HOST: "cache"
      CACHE_STORE: "redis"
      QUEUE_CONNECTION: "redis"
      SESSION_DRIVER: "redis"

      # Mail (optional)
      MAIL_FROM: "noreply@example.com"
      MAIL_MAILER: "smtp"
      MAIL_HOST: "mail"
      MAIL_PORT: "1025"
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_ENCRYPTION: "true"

    # Optional volumes for persistence across image updates:
    #volumes:
    #  - panel_var:/app/var        # persists .env + generated keys
    #  - panel_logs:/app/storage/logs

volumes:
  db_data:

#
# ── First deployment ─────────────────────────────────────────────────
#   docker compose up -d
#   docker compose exec panel php artisan p:user:make
#
# ── Generating APP_KEY & HASHIDS_SALT ────────────────────────────────
#   APP_KEY=$(head -c 48 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 32)
#   HASHIDS_SALT=$(head -c 48 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 20)
#   echo "APP_KEY=$APP_KEY"
#   echo "HASHIDS_SALT=$HASHIDS_SALT"
